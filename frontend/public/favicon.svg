<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="streamGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1a73e8" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0" y1="0" x2="0" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#d0e2ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1a73e8" flood-opacity="0.35" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Container -->
  <rect x="3" y="3" width="58" height="58" rx="16" fill="url(#streamGrad)" filter="url(#glow)" />
  <rect x="3.5" y="3.5" width="57" height="57" rx="15.5" stroke="rgba(255,255,255,0.3)" stroke-width="1" />
  
  <!-- Soundwave + Stream Indicator -->
  <!-- Wave Bar 1 -->
  <rect x="13" y="25" width="4" height="14" rx="2" fill="url(#waveGrad)" opacity="0.8" />
  <!-- Wave Bar 2 -->
  <rect x="20" y="19" width="4" height="26" rx="2" fill="url(#waveGrad)" opacity="0.95" />
  <!-- Wave Bar 3 -->
  <rect x="27" y="13" width="4" height="38" rx="2" fill="#ffffff" />
  <!-- Wave Bar 4 -->
  <rect x="34" y="20" width="4" height="24" rx="2" fill="url(#waveGrad)" opacity="0.95" />
  
  <!-- Stream Play Arrow Indicator -->
  <path d="M42 22.8C42 21.26 43.66 20.3 45 21.07L52.5 25.4C53.83 26.17 53.83 28.1 52.5 28.87L45 33.2C43.66 33.97 42 33.01 42 31.47V22.8Z" fill="#ffffff" />
</svg>